[package]
name = "mpk-deck"
version = "0.3.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

rodio = { version = "0.21", default-features = false, features = ["playback", "wav", "mp3"] }
tokio = { version = "1", features = ["sync"] }
windows = { version = "0.62", features = [
  "Devices_Enumeration", "Devices_Midi", "Foundation", "Storage_Streams",
  "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com",
  "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"
] }

[features]
custom-protocol = ["tauri/custom-protocol"]

